global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

# Балансировка для веб-сервисов 1С (порт 8080)
frontend http_front
    bind *:8080
    default_backend http_back

backend http_back
    balance roundrobin
    option httpchk GET /
    server ras-primary ras-primary:8080 check inter 5s fall 3 rise 2
    server ras-replica ras-replica:8080 check inter 5s fall 3 rise 2

# Балансировка для агента кластера 1С (порт 1541)
frontend ras_front
    bind *:1541
    default_backend ras_back

backend ras_back
    balance roundrobin
    option tcp-check
    server ras-primary ras-primary:1541 check inter 10s fall 3 rise 2
    server ras-replica ras-replica:1541 check inter 10s fall 3 rise 2

# Статистика HAProxy
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

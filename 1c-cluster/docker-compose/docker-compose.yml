services:
  # PostgreSQL Cluster (Primary + Replica)
  postgres-primary:
    image: docker.io/library/postgres:15-alpine
    container_name: pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: template1
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - 1c-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure

  postgres-replica:
    image: docker.io/library/postgres:15-alpine
    container_name: pg-replica
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator123
    command: >
      bash -c "
      until pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replication_slot --host=pg-primary --port=5432 --username=replicator --verbose; do
      echo 'Waiting for primary to connect...'
      sleep 1s
      done
      echo 'Backup done, starting replica...'
      chmod 0700 /var/lib/postgresql/data
      postgres
      "
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    networks:
      - 1c-network
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure

  # PgPool-II для балансировки PostgreSQL
  pgpool:
    image: docker.io/bitnami/pgpool:4.4
    container_name: pgpool
    environment:
      PGPOOL_BACKEND_NODES: 0:pg-primary:5432,1:pg-replica:5432
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: postgres123
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: admin123
      PGPOOL_ENABLE_LOAD_BALANCING: yes
      PGPOOL_FAILOVER_ON_BACKEND_ERROR: yes
    ports:
      - "5433:5432"
    networks:
      - 1c-network
    depends_on:
      - postgres-primary
      - postgres-replica
    deploy:
      restart_policy:
        condition: on-failure

  # 1С:Агент кластера (RAS) - основной
  ras-primary:
    image: docker.io/ghcr.io/1c-company/1c:enterprise-server-ubuntu
    container_name: ras-primary
    hostname: ras-primary
    environment:
      - SRV1CV8_SRVINST=0
      - SRV1CV8_USERS=usr1cv
      - SRV1CV8_PWD=passwd123
      - SRV1CV8_AGPORT=1541
      - SRV1CV8_RLZ_ADD=-rlz /opt/1C/v8.3/x86_64/license.lic
    volumes:
      - ras_primary_data:/home/usr1cv/.1cv8
      - shared-data:/mnt/shared
    ports:
      - "1540-1541:1540-1541"
      - "9100-9199:9100-9199"
    networks:
      - 1c-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "rmngr"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      restart_policy:
        condition: on-failure

  # 1С:Агент кластера (RAS) - резервный
  ras-replica:
    image: docker.io/ghcr.io/1c-company/1c:enterprise-server-ubuntu
    container_name: ras-replica
    hostname: ras-replica
    environment:
      - SRV1CV8_SRVINST=0
      - SRV1CV8_USERS=usr1cv
      - SRV1CV8_PWD=passwd123
      - SRV1CV8_AGPORT=1541
      - SRV1CV8_RLZ_ADD=-rlz /opt/1C/v8.3/x86_64/license.lic
    volumes:
      - ras_replica_data:/home/usr1cv/.1cv8
      - shared-data:/mnt/shared
    ports:
      - "2540-2541:1540-1541"
      - "9200-9299:9100-9199"
    networks:
      - 1c-network
    depends_on:
      - ras-primary
    healthcheck:
      test: ["CMD", "pgrep", "-f", "rmngr"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      restart_policy:
        condition: on-failure

  # Балансировщик нагрузки для 1С (HAProxy)
  haproxy:
    image: docker.io/library/haproxy:2.8-alpine
    container_name: haproxy-1c
    volumes:
      - ./docker-compose/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"
      - "1541:1541"
    networks:
      - 1c-network
    depends_on:
      - ras-primary
      - ras-replica
    deploy:
      restart_policy:
        condition: on-failure

  # Prometheus для мониторинга
  prometheus:
    image: docker.io/prom/prometheus:v2.47.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - 1c-network
    deploy:
      restart_policy:
        condition: on-failure

  # Grafana для визуализации
  grafana:
    image: docker.io/grafana/grafana:10.1.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - 1c-network
    depends_on:
      - prometheus
    deploy:
      restart_policy:
        condition: on-failure

  # Node Exporter для сбора метрик хоста
  node-exporter:
    image: docker.io/prom/node-exporter:v1.6.1
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'
    networks:
      - 1c-network
    deploy:
      restart_policy:
        condition: on-failure

networks:
  1c-network:
    driver: bridge

volumes:
  pg_primary_data:
  pg_replica_data:
  ras_primary_data:
  ras_replica_data:
  shared-data:
  prometheus_data:
  grafana_data:

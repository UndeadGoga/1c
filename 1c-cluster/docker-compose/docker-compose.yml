services:
  # Основная база данных (Primary)
  pg-primary:
    image: docker.io/library/postgres:15-alpine
    container_name: pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: demo_db
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./postgres/init-primary.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432" # Прямой доступ к БД для 1С
    networks:
      - 1c-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # HAProxy (опционально, для будущих расширений)
  haproxy:
    image: docker.io/library/haproxy:2.8-alpine
    container_name: haproxy-1c
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8787:8787"
    networks:
      - 1c-net
    restart: unless-stopped

  # Prometheus (Мониторинг)
  prometheus:
    image: docker.io/prom/prometheus:v2.47.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - 1c-net
    restart: unless-stopped

  # Node Exporter (Метрики хоста и контейнеров)
  node-exporter:
    image: docker.io/prom/node-exporter:v1.6.1
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - 1c-net
    restart: unless-stopped

  # Grafana (Визуализация)
  grafana:
    image: docker.io/grafana/grafana:10.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - 1c-net
    restart: unless-stopped

volumes:
  pg_primary_data:
  prometheus_data:
  grafana_data:

networks:
  1c-net:
    driver: bridge

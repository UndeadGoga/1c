services:
  # Основная база данных (Primary)
  pg-primary:
    image: postgres:15-alpine
    container_name: pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: demo_db
      REPLICATION_MODE: primary
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator123
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./postgres/init-primary.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - 1c-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Реплика базы данных (Replica)
  pg-replica:
    image: postgres:15-alpine
    container_name: pg-replica
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      REPLICATION_MODE: replica
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator123
      PRIMARY_HOST: pg-primary
    depends_on:
      pg-primary:
        condition: service_healthy
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    networks:
      - 1c-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Балансировщик соединений для БД (PgPool-II)
  pgpool:
    image: bitnami/pgpool:4.4
    container_name: pgpool
    environment:
      PGPOOL_BACKEND_NODES: 0:pg-primary:5432,1:pg-replica:5432
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: postgres123
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: admin123
      PGPOOL_ENABLE_LOAD_BALANCING: yes
      PGPOOL_FAILOVER_ON_BACKEND_ERROR: yes
      PGPOOL_HEALTH_CHECK_PERIOD: 10
      PGPOOL_HEALTH_CHECK_TIMEOUT: 5
      PGPOOL_HEALTH_CHECK_MAX_RETRIES: 3
    ports:
      - "5433:5432" # Доступ для 1С с хоста
    depends_on:
      pg-primary:
        condition: service_healthy
      pg-replica:
        condition: service_healthy
    networks:
      - 1c-net
    restart: always

  # HAProxy (для балансировки 1С, если потребуется несколько серверов в будущем)
  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy-1c
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8787:8787" # Порт для подключения клиентов 1С (если нужно)
    networks:
      - 1c-net
    restart: unless-stopped

  # Prometheus (Мониторинг)
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - 1c-net
    restart: unless-stopped

  # Node Exporter (Метрики хоста и контейнеров)
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - 1c-net
    restart: unless-stopped

  # Grafana (Визуализация)
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - 1c-net
    restart: unless-stopped

volumes:
  pg_primary_data:
  pg_replica_data:
  prometheus_data:
  grafana_data:

networks:
  1c-net:
    driver: bridge

global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

listen stats
    bind *:8787
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

# Этот бэкенд зарезервирован для будущих серверов 1С, 
# если вы решите запустить несколько экземпляров в Docker.
# Сейчас он просто заглушка, так как 1С работает на хосте.
backend 1c_servers
    balance roundrobin
    # server 1c_srv1 1c-server-1:1541 check
    # server 1c_srv2 1c-server-2:1541 check

---
# Ansible Playbook для развёртывания отказоустойчивого кластера 1С
- name: Развёртывание отказоустойчивого кластера 1С
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    project_name: "1c-cluster"
    docker_compose_file: "docker-compose/docker-compose.yml"
    
  tasks:
    - name: Проверка наличия Docker
      command: docker --version
      register: docker_version
      changed_when: false
      failed_when: docker_version.rc != 0

    - name: Вывод версии Docker
      debug:
        msg: "Docker версия: {{ docker_version.stdout }}"

    - name: Проверка наличия Docker Compose
      command: docker compose version
      register: compose_version
      changed_when: false
      failed_when: compose_version.rc != 0

    - name: Вывод версии Docker Compose
      debug:
        msg: "Docker Compose версия: {{ compose_version.stdout }}"

    - name: Создание директорий для данных
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - ./data/postgres/primary
        - ./data/postgres/replica
        - ./data/ras/primary
        - ./data/ras/replica
        - ./data/shared

    - name: Копирование скрипта инициализации БД
      copy:
        src: scripts/init-db.sh
        dest: scripts/init-db.sh
        mode: '0755'

    - name: Копирование конфигурации HAProxy
      copy:
        src: docker-compose/haproxy.cfg
        dest: docker-compose/haproxy.cfg
        mode: '0644'

    - name: Остановка существующих контейнеров (если есть)
      command: docker compose -f {{ docker_compose_file }} down
      ignore_errors: yes
      changed_when: false

    - name: Запуск кластера 1С
      command: docker compose -f {{ docker_compose_file }} up -d
      register: compose_up
      changed_when: "'Creating' in compose_up.stdout or 'Starting' in compose_up.stdout"

    - name: Ожидание готовности PostgreSQL
      wait_for:
        timeout: 30
      when: compose_up.changed

    - name: Проверка статуса контейнеров
      command: docker compose -f {{ docker_compose_file }} ps
      register: container_status
      changed_when: false

    - name: Вывод статуса контейнеров
      debug:
        msg: "{{ container_status.stdout_lines }}"

    - name: Вывод информации о портах
      debug:
        msg: |
          Кластер 1С успешно развёрнут!
          
          Доступные сервисы:
          - PostgreSQL (через PgPool): localhost:5433
          - 1С RAS (балансировщик): localhost:1541
          - Веб-сервисы 1С: localhost:8080
          - Prometheus: http://localhost:9090
          - Grafana: http://localhost:3000 (admin/admin123)
          - HAProxy Stats: http://localhost:8404/stats

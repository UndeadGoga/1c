global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus сам себя мониторит
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter для метрик хоста
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL Exporter (нужно добавить контейнер postgres-exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['pg-primary:9187']
    metrics_path: /metrics
    params:
      username: [postgres]
      password: [postgres123]

  # HAProxy Exporter
  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy-1c:8404']
    metrics_path: /stats

  # 1С сервера (через exporter для 1С, если доступен)
  - job_name: '1c-ras'
    static_configs:
      - targets: ['ras-primary:1541', 'ras-replica:1541']
    metrics_path: /metrics

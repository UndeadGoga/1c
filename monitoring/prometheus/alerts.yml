groups:
  - name: 1c-cluster-alerts
    rules:
      # -------------------------------------------------------------------
      # PostgreSQL Alerts
      # -------------------------------------------------------------------
      - alert: PostgreSQLPrimaryDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL Primary недоступен"
          description: "PostgreSQL Primary не отвечает более 1 минуты."

      - alert: PostgreSQLReplicationLag
        expr: pg_stat_replication_pg_wal_lsn_diff / 1024 / 1024 > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Большая задержка репликации PostgreSQL"
          description: "Репликация отстаёт более чем на 100 MB в течение 5 минут."

      - alert: PostgreSQLHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокое число подключений к PostgreSQL"
          description: "Использовано более 80% доступных подключений."

      # -------------------------------------------------------------------
      # 1C Server Alerts
      # -------------------------------------------------------------------
      - alert: OneCServerDown
        expr: probe_success{job="blackbox-1c-tcp"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "1С Сервер недоступен"
          description: "Проверка TCP-порта {{ $labels.instance }} не пройдена."

      # -------------------------------------------------------------------
      # System Alerts
      # -------------------------------------------------------------------
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка CPU"
          description: "CPU загружен на {{ $value }}% более 5 минут."

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокое использование памяти"
          description: "Память заполнена на {{ $value }}%."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Заканчивается место на диске"
          description: "На разделе / осталось менее 10% свободного места."

      - alert: BackupNotPerformed
        expr: time() - max by(job) (backup_last_success_timestamp{job="postgres-backup"}) > 90000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Резервное копирование не выполнялось"
          description: "Последний успешный backup был более 25 часов назад."

# =============================================================================
# HAProxy — балансировка и отказоустойчивость серверов 1С
# =============================================================================

global
    log stdout local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5000ms
    timeout client 30000ms
    timeout server 30000ms
    retries 3

# ---------------------------------------------------------------------------
# Статистика HAProxy
# ---------------------------------------------------------------------------
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats auth admin:admin

# ---------------------------------------------------------------------------
# Балансировка ragent (порт 1540) — подключение клиентов 1С
# ---------------------------------------------------------------------------
listen 1c_ragent
    bind *:1540
    mode tcp
    option tcp-check
    balance roundrobin
    server 1c-server-1 1c-server-1:1540 check inter 2000 fall 3 rise 2
    server 1c-server-2 1c-server-2:1540 check inter 2000 fall 3 rise 2 backup

# ---------------------------------------------------------------------------
# Балансировка rmngr (порт 1541) — менеджер кластера
# ---------------------------------------------------------------------------
listen 1c_rmngr
    bind *:1541
    mode tcp
    option tcp-check
    balance roundrobin
    server 1c-server-1 1c-server-1:1541 check inter 2000 fall 3 rise 2
    server 1c-server-2 1c-server-2:1541 check inter 2000 fall 3 rise 2 backup

# ---------------------------------------------------------------------------
# Балансировка RAS (порт 1545) — администрирование
# ---------------------------------------------------------------------------
listen 1c_ras
    bind *:1545
    mode tcp
    option tcp-check
    balance roundrobin
    server 1c-ras 1c-ras:1545 check inter 2000 fall 3 rise 2

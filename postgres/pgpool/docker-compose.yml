# =============================================================================
# PgPool-II — балансировщик и менеджер отказоустойчивости PostgreSQL
# =============================================================================
# Опциональный компонент. Может заменить HAProxy для PostgreSQL.
# =============================================================================

version: "3.8"

services:
  pgpool:
    image: bitnami/pgpool:4
    container_name: pgpool
    hostname: pgpool
    environment:
      - PGPOOL_BACKEND_NODES=0:postgres-primary:5432,1:postgres-replica:5432
      - PGPOOL_SR_CHECK_USER=replicator
      - PGPOOL_SR_CHECK_PASSWORD=repl_password
      - PGPOOL_POSTGRES_USERNAME=postgres
      - PGPOOL_POSTGRES_PASSWORD=postgres_password
      - PGPOOL_ADMIN_USERNAME=admin
      - PGPOOL_ADMIN_PASSWORD=admin
      - PGPOOL_ENABLE_LOAD_BALANCING=yes
      - PGPOOL_FAILOVER_ON_BACKEND_ERROR=yes
      - PGPOOL_HEALTH_CHECK_PERIOD=10
      - PGPOOL_HEALTH_CHECK_TIMEOUT=5
      - PGPOOL_HEALTH_CHECK_MAX_RETRIES=3
    ports:
      - "9999:5432"
      - "9898:9898"
    networks:
      - pgnet
    restart: unless-stopped

networks:
  pgnet:
    external: true
